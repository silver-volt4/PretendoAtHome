services:
  super-mario-maker:
    build: .
    depends_on:
      - account
      - minio
      - postgres
    restart: always
    ports:
      - 127.0.0.1:2348:2345
      # Authentication server
      - 6004:6004/udp
      # Secure server
      - 6005:6005/udp
    networks:
      internal:
    dns: 172.20.0.200
    environment:
      - PN_SMM_AUTHENTICATION_SERVER_PORT=6004
      - PN_SMM_SECURE_SERVER_PORT=6005
      - PN_SMM_CONFIG_S3_ENDPOINT=minio.pretendo.cc
      - PN_SMM_CONFIG_S3_ACCESS_KEY=minio_pretendo
      - PN_SMM_CONFIG_S3_BUCKET=super-mario-maker
      - PN_SMM_CONFIG_S3_SECURE=false
      - PN_SMM_ACCOUNT_GRPC_HOST=account
      - PN_SMM_ACCOUNT_GRPC_PORT=5000
      - PN_SMM_ACCOUNT_GRPC_API_KEY=${PN_ACT_CONFIG_GRPC_MASTER_API_KEY_API?}
      - PN_SMM_CONFIG_S3_ACCESS_SECRET=${MINIO_ROOT_PASSWORD?}
      - PN_SMM_POSTGRES_URI=postgres://postgres_pretendo:${POSTGRES_PASSWORD?}@postgres/super_mario_maker?sslmode=disable
      - PN_SMM_KERBEROS_PASSWORD=${PN_SMM_KERBEROS_PASSWORD?}
      - PN_SMM_SECURE_SERVER_HOST=${PN_SMM_SECURE_SERVER_HOST?}
      - PN_SMM_GRPC_SERVER_PORT=5000
