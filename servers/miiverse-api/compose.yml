services:
  miiverse-api:
    build: .
    depends_on:
      - account
      - mongodb
      - friends
    restart: always
    networks:
      internal:
    dns: 172.20.0.200
    environment:
      - PN_MIIVERSE_API_ACCOUNT_SERVER_ADDRESS=account
      - PN_MIIVERSE_API_AES_KEY=${PN_MIIVERSE_API_CONFIG_AES_KEY?}
      - PN_MIIVERSE_API_GRPC_ACCOUNT_HOST=account
      - PN_MIIVERSE_API_GRPC_ACCOUNT_PORT=5000
      - PN_MIIVERSE_API_GRPC_ACCOUNT_API_KEY=${PN_ACT_CONFIG_GRPC_MASTER_API_KEY_API?}
      - PN_MIIVERSE_API_GRPC_FRIENDS_HOST=friends
      - PN_MIIVERSE_API_GRPC_FRIENDS_PORT=5001
      - PN_MIIVERSE_API_GRPC_FRIENDS_API_KEY=${PN_FRIENDS_CONFIG_GRPC_API_KEY?}
      - PN_MIIVERSE_API_GRPC_SERVER_API_KEY=${PN_MIIVERSE_API_GRPC_SERVER_API_KEY?}
      - PN_MIIVERSE_API_HTTP_PORT=8080
      - PN_MIIVERSE_API_DB_URL=postgres://postgres_pretendo:${POSTGRES_PASSWORD?}@postgres/miiverse?sslmode=disable
      - PN_MIIVERSE_API_MONGOOSE_URI=mongodb://mongodb:27017/pretendo_miiverse?replicaSet=rs
      - PN_MIIVERSE_API_S3_KEY=minio_pretendo
      - PN_MIIVERSE_API_S3_SECRET=${MINIO_ROOT_PASSWORD?}
      - PN_MIIVERSE_API_S3_BUCKET=miiverse
      - PN_MIIVERSE_API_S3_REGION=us-east-1
      - PN_MIIVERSE_API_S3_ENDPOINT=http://minio.pretendo.cc
      - PN_MIIVERSE_API_CDN_URL=https://cdn.pretendo.network
