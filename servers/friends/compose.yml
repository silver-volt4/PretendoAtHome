services:
  friends:
    image: ghcr.io/pretendonetwork/friends:latest
    depends_on:
      - account
      - postgres
    restart: always
    ports:
      # Authentication server
      - 6000:6000/udp
      # Secure server
      - 6001:6001/udp
    networks:
      internal:
    dns: 172.20.0.200
    environment:
      - PN_FRIENDS_CONFIG_ACCOUNT_GRPC_HOST=account
      - PN_FRIENDS_CONFIG_ACCOUNT_GRPC_PORT=5000
      - PN_FRIENDS_CONFIG_ACCOUNT_GRPC_API_KEY=${PN_ACT_CONFIG_GRPC_MASTER_API_KEY_API?}
      - PN_FRIENDS_CONFIG_AES_KEY=${PN_FRIENDS_CONFIG_AES_KEY?}
      - PN_FRIENDS_CONFIG_AUTHENTICATION_PASSWORD=${PN_FRIENDS_CONFIG_AUTHENTICATION_PASSWORD?}
      - PN_FRIENDS_CONFIG_AUTHENTICATION_SERVER_PORT=6000
      - PN_FRIENDS_CONFIG_GRPC_API_KEY=${PN_FRIENDS_CONFIG_GRPC_API_KEY?}
      - PN_FRIENDS_CONFIG_GRPC_SERVER_PORT=5001
      - PN_FRIENDS_CONFIG_POSTGRES_MAX_CONNECTIONS=128
      - PN_FRIENDS_CONFIG_POSTGRES_URI=postgres://postgres_pretendo:${POSTGRES_PASSWORD?}@postgres/friends?sslmode=disable
      - PN_FRIENDS_CONFIG_SECURE_PASSWORD=${PN_FRIENDS_CONFIG_SECURE_PASSWORD?}
      - PN_FRIENDS_CONFIG_SECURE_SERVER_HOST=${MACHINE_IP?}
      - PN_FRIENDS_CONFIG_SECURE_SERVER_PORT=6001
