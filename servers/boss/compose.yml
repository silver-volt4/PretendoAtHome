services:
  boss:
    build: .
    depends_on:
      - account
      - mongodb
    restart: always
    volumes:
      - type: bind
        source: ./mongoose-connect-options.json
        target: /home/node/app/mongoose-connect-options.json
        read_only: true
    networks:
      internal:
    dns: 172.20.0.200
    environment:
      - PN_BOSS_CONFIG_HTTP_PORT=8080
      - PN_BOSS_CONFIG_MONGOOSE_CONNECT_OPTIONS_PATH=/home/node/app/mongoose-connect-options.json
      - PN_BOSS_CONFIG_GRPC_BOSS_SERVER_ADDRESS=0.0.0.0
      - PN_BOSS_CONFIG_GRPC_BOSS_SERVER_PORT=5002
      - PN_BOSS_CONFIG_GRPC_BOSS_SERVER_API_KEY=${PN_BOSS_CONFIG_GRPC_BOSS_SERVER_API_KEY?}
      - PN_BOSS_CONFIG_GRPC_ACCOUNT_SERVER_ADDRESS=account
      - PN_BOSS_CONFIG_GRPC_ACCOUNT_SERVER_PORT=5000
      - PN_BOSS_CONFIG_GRPC_ACCOUNT_SERVER_API_KEY=${PN_ACT_CONFIG_GRPC_MASTER_API_KEY_API?}
      - PN_BOSS_CONFIG_GRPC_FRIENDS_SERVER_ADDRESS=friends
      - PN_BOSS_CONFIG_GRPC_FRIENDS_SERVER_PORT=5001
      - PN_BOSS_CONFIG_GRPC_FRIENDS_SERVER_API_KEY=${PN_FRIENDS_CONFIG_GRPC_API_KEY?}
      - PN_BOSS_CONFIG_MONGO_CONNECTION_STRING=mongodb://mongodb:27017/pretendo_boss?replicaSet=rs
      - PN_BOSS_CONFIG_CDN_DOWNLOAD_URL=https://npdi.cdn.pretendo.cc
      - PN_BOSS_CONFIG_S3_ENDPOINT=http://minio.pretendo.cc
      - PN_BOSS_CONFIG_S3_REGION=us-east-1
      - PN_BOSS_CONFIG_S3_BUCKET=pn-boss
      - PN_BOSS_CONFIG_S3_ACCESS_KEY=minio_pretendo
      - PN_BOSS_CONFIG_S3_ACCESS_SECRET=${MINIO_ROOT_PASSWORD?}
      - PN_BOSS_CONFIG_BOSS_3DS_AES_KEY=${PN_BOSS_CONFIG_BOSS_3DS_AES_KEY?}
