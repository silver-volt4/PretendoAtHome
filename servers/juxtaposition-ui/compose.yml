services:
  juxtaposition-ui:
    build: .
    depends_on:
      - account
      - mongodb
      - redis
      - friends
    restart: always
    networks:
      internal:
    dns: 172.20.0.200
    environment:
      - PN_JUXTAPOSITION_UI_HTTP_PORT=8080
      - PN_JUXTAPOSITION_UI_MONGODB_URI=mongodb://mongodb:27017
      - PN_JUXTAPOSITION_UI_MONGODB_DATABASE=pretendo_miiverse?replicaSet=rs
      - PN_JUXTAPOSITION_UI_AES_KEY=${PN_MIIVERSE_API_CONFIG_AES_KEY?}
      - PN_JUXTAPOSITION_UI_SERVER_ENVIRONMENT=prod
      - PN_JUXTAPOSITION_UI_CDN_DOMAIN=https://cdn.pretendo.network
      - PN_JUXTAPOSITION_UI_MII_IMAGE_CDN=mii.olv.pretendo.cc
      - PN_JUXTAPOSITION_UI_ACCOUNT_SERVER_DOMAIN=account.pretendo.cc
      - PN_JUXTAPOSITION_UI_GRPC_FRIENDS_HOST=friends
      - PN_JUXTAPOSITION_UI_GRPC_FRIENDS_PORT=5001
      - PN_JUXTAPOSITION_UI_GRPC_FRIENDS_API_KEY=${PN_FRIENDS_CONFIG_GRPC_API_KEY?}
      - PN_JUXTAPOSITION_UI_GRPC_ACCOUNT_HOST=account
      - PN_JUXTAPOSITION_UI_GRPC_ACCOUNT_PORT=5000
      - PN_JUXTAPOSITION_UI_GRPC_ACCOUNT_API_KEY=${PN_ACT_CONFIG_GRPC_MASTER_API_KEY_API?}
      - PN_JUXTAPOSITION_UI_GRPC_MIIVERSE_HOST=miiverse-api
      - PN_JUXTAPOSITION_UI_GRPC_MIIVERSE_PORT=8125
      - PN_JUXTAPOSITION_UI_GRPC_MIIVERSE_API_KEY=${PN_ACT_CONFIG_GRPC_MASTER_API_KEY_API?}
      - PN_JUXTAPOSITION_UI_WHITELIST=1|http,mii.olv.pretendo.cc,,2|1|https,mii.olv.pretendo.cc,,2|1|http,cdn.olv.pretendo.cc,,2|1|https,cdn.olv.pretendo.cc,,2|1|https,kaeru.b-cdn.net,,2|1|https,cdn.jsdelivr.net,,2|1|http,kt-imogen.b-cdn.net,,2|1|http,youtube.com,,2|http,portal.cdn.pretendo.cc,,2|https,portal.cdn.pretendo.cc,,2|http,pretendo-cdn.b-cdn.net,,2|https,pretendo-cdn.b-cdn.net,,2|https,youtube.com,,2|http,.youtube.com,,2|https,.youtube.com,,2|http,.ytimg.com,,2|https,.ytimg.com,,2|http,.googlevideo.com,,2|https,.googlevideo.com,,2|https,youtube.com,/embed/,6|https,youtube.com,/e/,6|https,youtube.com,/v/,6|https,www.youtube.com,/embed/,6|https,www.youtube.com,/e/,6|https,www.youtube.com,/v/,6|https,youtube.googleapis.com,/e/,6|https,youtube.googleapis.com,/v/,6|http,maps.googleapis.com,/maps/api/streetview,2|https,maps.googleapis.com,/maps/api/streetview,2|http,cbk0.google.com,/cbk,2|https,cbk0.google.com,/cbk,2|http,cbk1.google.com,/cbk,2|https,cbk1.google.com,/cbk,2|http,cbk2.google.com,/cbk,2|https,cbk2.google.com,/cbk,2|http,cbk3.google.com,/cbk,2|https,cbk3.google.com,/cbk,2|https,.cloudfront.net,,2|https,www.google-analytics.com,/,2|https,stats.g.doubleclick.net,,2|https,www.google.com,/ads/,2|https,ssl.google-analytics.com,,2|http,fonts.googleapis.com,,2|fonts.googleapis.com,,2|https,www.googletagmanager.com,,2|http,miiverse.cc,,2|https,miiverse.cc,,2
